<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peened Moodboard</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Header -->
    <header class="header">
      <div class="header-brand">
        <img src="../assets/icon-48.png" class="logo-icon" alt="Peened" width="20" height="20" style="border-radius: 4px; display: block;" />
        <h1 class="brand-title">Peened</h1>
        <span id="badge-count" class="pin-counter">0</span>
      </div>
      <div class="header-actions">
        <button id="btn-manual-add" class="icon-btn" title="Add manual pin / note">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="btn-export" class="icon-btn" title="Export / Backup JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button id="btn-import" class="icon-btn" title="Import / Restore JSON backup">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
        <input type="file" id="file-import-json" accept=".json" style="display:none;" />
        <button id="btn-clear-all" class="icon-btn danger" title="Clear all pins">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search & Filters -->
    <section class="controls-section">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search pins, tags, sources..." autocomplete="off" />
        <button id="btn-clear-search" class="clear-search-btn" style="display:none;">&times;</button>
      </div>

      <!-- Type Filter Pills -->
      <div class="filter-pills" id="type-filters">
        <button class="pill active" data-type="all">All</button>
        <button class="pill" data-type="image">Images</button>
        <button class="pill" data-type="text">Texts</button>
        <button class="pill" data-type="link">Links</button>
      </div>

      <!-- Tag Filter Cloud -->
      <div class="tag-cloud" id="tag-cloud" style="display:none;"></div>
    </section>

    <!-- Main Content Stream / Moodboard -->
    <main class="pins-container" id="pins-container">
      <!-- Injected via sidepanel.js -->
    </main>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display:none;">
      <img src="../assets/icon-128.png" class="empty-icon" alt="Peened" width="48" height="48" style="border-radius: 12px; margin-bottom: 12px; display: block;" />
      <h3 class="empty-title">Your moodboard is empty</h3>
      <p class="empty-desc">Pin anything interesting you find while browsing:</p>
      <div class="empty-tips">
        <div class="tip-item">
          <span class="tip-badge">Images</span>
          <span>Right-click any image &rarr; <strong>Pin image</strong></span>
        </div>
        <div class="tip-item">
          <span class="tip-badge">Text</span>
          <span>Highlight text &rarr; Right-click &rarr; <strong>Pin text</strong></span>
        </div>
        <div class="tip-item">
          <span class="tip-badge">Pages</span>
          <span>Right-click anywhere &rarr; <strong>Pin page</strong></span>
        </div>
      </div>
    </div>

    <!-- Manual Add Modal -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Add Quick Pin</h3>
          <button id="btn-close-modal" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <label class="modal-label">Type</label>
          <div class="type-selector">
            <label><input type="radio" name="manual-type" value="text" checked /> Text / Note</label>
            <label><input type="radio" name="manual-type" value="image" /> Image URL</label>
            <label><input type="radio" name="manual-type" value="link" /> Link</label>
          </div>
          <label class="modal-label">Content</label>
          <textarea id="manual-content" placeholder="Paste image URL, text quote, or link..." rows="3"></textarea>
          <label class="modal-label">Tags (comma separated)</label>
          <input type="text" id="manual-tags" placeholder="#edit, #idea, #reference" />
        </div>
        <div class="modal-footer">
          <button id="btn-cancel-modal" class="btn secondary">Cancel</button>
          <button id="btn-save-modal" class="btn primary">Save Pin</button>
        </div>
      </div>
    </div>

    <!-- Toast Notice in Side Panel -->
    <div id="sidepanel-toast" class="sidepanel-toast" style="display:none;"></div>

    <!-- Image Lightbox Modal -->
    <div class="lightbox-overlay" id="lightbox-overlay" style="display:none;">
      <button class="lightbox-close" id="btn-close-lightbox" title="Close preview">&times;</button>
      <div class="lightbox-modal">
        <div class="lightbox-image-container">
          <img id="lightbox-img" src="" alt="Full preview" />
        </div>
        <div class="lightbox-bar">
          <button id="btn-lightbox-copy" class="btn primary">Copy Image</button>
          <a id="btn-lightbox-source" href="#" target="_blank" rel="noopener noreferrer" class="btn secondary">Open Original</a>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
